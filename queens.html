<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <title>Queens Game Suite</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #b0b0b0;
            --thick-border-color: #222222;
            --primary-btn: #3b82f6;
            --btn-text: #ffffff;
            --error-color: #dc2626;
        }
        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --border-color: #444444;
            --thick-border-color: #888888;
            --primary-btn: #2563eb;
            --btn-text: #ffffff;
            --error-color: #f87171;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color); color: var(--text-color); margin: 0;
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
        }
        .container { width: 100%; max-width: 650px; padding: 24px; background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.1); }
        .game-nav { display: flex; gap: 3px; padding: 3px; margin-bottom: 18px; background: var(--border-color); border-radius: 8px; }
        .nav-tab { flex: 1; padding: 8px 0; border-radius: 6px; color: var(--text-color); text-align: center; text-decoration: none; font-size: .9rem; font-weight: 600; }
        .nav-tab.active { color: var(--primary-btn); background: var(--card-bg); box-shadow: 0 2px 4px rgba(0,0,0,.05); }
        header, .game-info { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        header { margin-bottom: 15px; }
        h1 { margin: 0; font-size: 1.5rem; }
        .controls-top { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
        .btn-secondary { padding: 6px 10px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--card-bg); color: var(--text-color); cursor: pointer; font-size: .85rem; }
        .game-info { margin-bottom: 12px; font-size: .95rem; font-weight: 500; }
        .queens-board-container { display: flex; justify-content: center; overflow-x: auto; padding: 10px 0 20px; }
        .queens-board { display: grid; gap: 1px; padding: 2px; border: 2px solid var(--thick-border-color); background: var(--thick-border-color); border-radius: 4px; }
        .queens-cell { display: flex; align-items: center; justify-content: center; width: 42px; height: 42px; border: 0; color: #111; cursor: pointer; font-size: 1.35rem; user-select: none; }
        .queens-cell.given { cursor: not-allowed; }
        .queens-cell.error { outline: 3px solid var(--error-color); outline-offset: -3px; }
        .queens-cell.x { font-size: 1.15rem; font-weight: 700; }
        .queens-cell.crown { font-size: 1.4rem; }
        .modal-overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .2s; }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }
        .modal-content { width: 320px; padding: 24px; border-radius: 12px; background: var(--card-bg); color: var(--text-color); box-shadow: 0 4px 16px rgba(0,0,0,.2); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; }
        .modal-content h2 { margin-top: 0; font-size: 1.25rem; }
        .modal-dismiss-btn { border: 0; background: none; color: var(--text-color); font-size: 1.4rem; line-height: 1; cursor: pointer; padding: 0 0 4px 8px; }
        .setting-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .setting-item input[type="range"] { width: 110px; }
        .modal-close-btn { width: 100%; margin-top: 8px; padding: 8px; border: 0; border-radius: 6px; background: var(--primary-btn); color: var(--btn-text); font-weight: bold; cursor: pointer; }
        @media (max-width: 560px) {
            body { align-items: flex-start; }
            .container { padding: 16px 10px; border-radius: 0; min-height: 100vh; }
            header { align-items: flex-start; flex-direction: column; }
            .controls-top { justify-content: flex-start; }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="game-nav">
            <a href="index.html" class="nav-tab">Sudoku</a>
            <a href="tango.html" class="nav-tab">Tango</a>
            <a href="queens.html" class="nav-tab active">Queens</a>
            <a href="crossword.html" class="nav-tab">Crossword</a>
        </nav>
        <div class="game-view">
            <header>
                <h1>Queens</h1>
                <div class="controls-top">
                    <select id="queensSizeSelect" class="btn-secondary">
                        <option value="6" selected>6x6</option>
                        <option value="8">8x8</option>
                        <option value="10">10x10</option>
                        <option value="12">12x12</option>
                        <option value="14">14x14</option>
                    </select>
                    <select id="queensDifficultySelect" class="btn-secondary">
                        <option value="easy">Easy</option>
                        <option value="medium" selected>Medium</option>
                        <option value="hard">Hard</option>
                    </select>
                    <button class="btn-secondary" id="queensOptionsBtn" title="Options">⚙️</button>
                    <button class="btn-secondary" id="queensNewGameBtn">New Game</button>
                    <button class="btn-secondary" id="queensHintBtn">Hint</button>
                    <button class="btn-secondary" id="themeToggleBtn">🌙</button>
                </div>
            </header>
            <div class="game-info"><span id="queensDiffDisplay">Difficulty: Medium</span><span id="queensStatus">Loading...</span></div>
            <div class="queens-board-container"><div class="queens-board" id="queensBoard"></div></div>
        </div>
    </div>
    <div class="modal-overlay" id="queensOptionsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Game Options</h2>
                <button class="modal-dismiss-btn" id="queensDismissModalBtn" type="button" aria-label="Discard changes and close options">&times;</button>
            </div>
            <div class="setting-item"><label for="toggleQueenAutoX">Automatic X placement</label><input type="checkbox" id="toggleQueenAutoX" checked></div>
            <div class="setting-item"><label for="toggleQueenAutoRemoval">Automatic X removal</label><input type="checkbox" id="toggleQueenAutoRemoval" checked></div>
            <div class="setting-item"><label for="queenOpeningHintSlider">Opening hint: <span id="queenOpeningHintValue">Off</span></label><input type="range" id="queenOpeningHintSlider" min="0" max="1" step="1" value="0"></div>
            <button class="modal-close-btn" id="queensCloseModalBtn">Save &amp; Close</button>
        </div>
    </div>
    <script>
        const htmlElement = document.documentElement;
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light' || savedTheme === 'dark') {
            htmlElement.dataset.theme = savedTheme;
            themeToggleBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';
        }

        const queensBoardElement = document.getElementById('queensBoard');
        const queensSizeSelect = document.getElementById('queensSizeSelect');
        const queensDifficultySelect = document.getElementById('queensDifficultySelect');
        const queensNewGameBtn = document.getElementById('queensNewGameBtn');
        const queensHintBtn = document.getElementById('queensHintBtn');
        const queensOptionsBtn = document.getElementById('queensOptionsBtn');
        const queensOptionsModal = document.getElementById('queensOptionsModal');
        const queensCloseModalBtn = document.getElementById('queensCloseModalBtn');
        const queensDismissModalBtn = document.getElementById('queensDismissModalBtn');
        const toggleQueenAutoX = document.getElementById('toggleQueenAutoX');
        const toggleQueenAutoRemoval = document.getElementById('toggleQueenAutoRemoval');
        const queenOpeningHintSlider = document.getElementById('queenOpeningHintSlider');
        const queenOpeningHintValue = document.getElementById('queenOpeningHintValue');
        const queensDiffDisplay = document.getElementById('queensDiffDisplay');
        const queensStatus = document.getElementById('queensStatus');
        let queensSize = 6;
        let queensBoardData = [];
        let queensSolution = [];
        let queensColors = [];
        let queensGivens = [];
        let queensIsWon = false;
        let queensAutomaticXs = new Set();
        let queensManualXs = new Set();
        let queensSettings = { automaticXPlacement: true, automaticXRemoval: true, openingHint: false };
        try {
            const savedQueensSettings = JSON.parse(localStorage.getItem('queens_settings') || 'null');
            if (savedQueensSettings) queensSettings = { ...queensSettings, ...savedQueensSettings };
        } catch (error) {}
        toggleQueenAutoX.checked = queensSettings.automaticXPlacement;
        toggleQueenAutoRemoval.checked = queensSettings.automaticXRemoval;
        queenOpeningHintSlider.value = queensSettings.openingHint ? '1' : '0';
        queenOpeningHintValue.textContent = queensSettings.openingHint ? 'On' : 'Off';

        queenOpeningHintSlider.addEventListener('input', event => {
            queenOpeningHintValue.textContent = event.target.value === '1' ? 'On' : 'Off';
        });

        themeToggleBtn.addEventListener('click', () => {
            const newTheme = htmlElement.dataset.theme === 'light' ? 'dark' : 'light';
            htmlElement.dataset.theme = newTheme;
            localStorage.setItem('theme', newTheme);
            themeToggleBtn.textContent = newTheme === 'dark' ? '☀️' : '🌙';
        });

        function toSymbol(value) {
            return value === 1 ? '×' : value === 2 ? '♛' : '';
        }

        async function initQueensGame(size = 6, difficulty = 'medium') {
            queensSize = size;
            queensIsWon = false;
            queensDiffDisplay.textContent = `Difficulty: ${difficulty.charAt(0).toUpperCase() + difficulty.slice(1)}`;
            try {
                const response = await fetch(`/api/puzzle?game=queens&size=${size}&difficulty=${difficulty}&openingHint=${queensSettings.openingHint}`, { cache: 'no-store' });
                const data = await response.json();
                if (response.ok && data.rows && data.solution && data.colors) {
                    queensSize = data.size;
                    queensBoardData = data.rows.flat();
                    queensSolution = data.solution.flat();
                    queensColors = data.colors;
                    queensGivens = queensBoardData.map(value => value !== 0);
                    queensAutomaticXs = new Set();
                    queensManualXs = new Set();
                    refreshAutomaticExclusions();
                    renderQueensBoard();
                    return;
                }
                throw new Error(data.error || 'Invalid Queens response.');
            } catch (error) {
                console.error('[Queens] Failed to load puzzle:', error);
                queensBoardData = Array(size * size).fill(0);
                queensSolution = [];
                queensColors = Array(size * size).fill('#ddd');
                queensGivens = Array(size * size).fill(false);
                queensAutomaticXs = new Set();
                queensManualXs = new Set();
                queensStatus.textContent = 'Unable to load puzzle';
                renderQueensBoard();
            }
        }

        function refreshAutomaticExclusions() {
            const desiredAutomaticXs = new Set();
            if (queensSettings.automaticXPlacement) {
                queensBoardData.forEach((value, index) => {
                    if (value !== 2) return;
                    const row = Math.floor(index / queensSize);
                    const column = index % queensSize;
                    for (let r = 0; r < queensSize; r++) {
                        for (let c = 0; c < queensSize; c++) {
                            const cellIndex = r * queensSize + c;
                            const adjacent = Math.abs(r - row) <= 1 && Math.abs(c - column) <= 1;
                            const sameColor = queensColors[cellIndex] === queensColors[index];
                            if (cellIndex !== index && (r === row || c === column || adjacent || sameColor)) desiredAutomaticXs.add(cellIndex);
                        }
                    }
                });
            }

            if (queensSettings.automaticXRemoval) {
                queensAutomaticXs.forEach(index => {
                    if (!desiredAutomaticXs.has(index) && !queensManualXs.has(index) && queensBoardData[index] === 1) queensBoardData[index] = 0;
                });
            }
            queensAutomaticXs = desiredAutomaticXs;
            queensAutomaticXs.forEach(index => {
                if (queensBoardData[index] === 0) queensBoardData[index] = 1;
            });
        }

        function applyQueenExclusions(index) {
            refreshAutomaticExclusions();
        }

        function renderQueensBoard() {
            queensBoardElement.style.gridTemplateColumns = `repeat(${queensSize}, 42px)`;
            queensBoardElement.innerHTML = '';
            for (let index = 0; index < queensSize * queensSize; index++) {
                const cell = document.createElement('div');
                const value = queensBoardData[index] || 0;
                cell.className = `queens-cell ${value === 1 ? 'x' : value === 2 ? 'crown' : ''}${queensGivens[index] ? ' given' : ''}`;
                cell.style.backgroundColor = queensColors[index] || '#ddd';
                cell.textContent = toSymbol(value);
                cell.addEventListener('click', () => handleQueensCellClick(index));
                queensBoardElement.appendChild(cell);
            }
            checkQueensWin();
        }

        function handleQueensCellClick(index) {
            if (queensIsWon || queensGivens[index]) return;
            const nextValue = (queensBoardData[index] + 1) % 3;
            queensBoardData[index] = nextValue;
            if (nextValue === 1) queensManualXs.add(index);
            else queensManualXs.delete(index);
            if (nextValue === 2) {
                queensAutomaticXs.delete(index);
                queensManualXs.delete(index);
            }
            applyQueenExclusions(index);
            renderQueensBoard();
        }

        function giveQueensHint() {
            if (queensIsWon || queensSolution.length === 0) return;
            const eligible = queensBoardData.map((value, index) => value !== queensSolution[index] && !queensGivens[index] ? index : -1).filter(index => index !== -1);
            if (eligible.length === 0) return;
            const index = eligible[Math.floor(Math.random() * eligible.length)];
            queensBoardData[index] = queensSolution[index];
            if (queensBoardData[index] === 1) queensManualXs.add(index);
            if (queensBoardData[index] === 2) {
                queensManualXs.delete(index);
                queensAutomaticXs.delete(index);
            }
            applyQueenExclusions(index);
            renderQueensBoard();
        }

        function checkQueensWin() {
            if (queensSolution.length === 0) return;
            const isWon = queensBoardData.every((value, index) => value === queensSolution[index]);
            queensIsWon = isWon;
            queensStatus.textContent = isWon ? 'Solved!' : 'In progress';
        }

        queensOptionsBtn.addEventListener('click', () => queensOptionsModal.classList.add('open'));
        queensDismissModalBtn.addEventListener('click', () => {
            toggleQueenAutoX.checked = queensSettings.automaticXPlacement;
            toggleQueenAutoRemoval.checked = queensSettings.automaticXRemoval;
            queenOpeningHintSlider.value = queensSettings.openingHint ? '1' : '0';
            queenOpeningHintValue.textContent = queensSettings.openingHint ? 'On' : 'Off';
            queensOptionsModal.classList.remove('open');
        });
        queensCloseModalBtn.addEventListener('click', () => {
            queensSettings.automaticXPlacement = toggleQueenAutoX.checked;
            queensSettings.automaticXRemoval = toggleQueenAutoRemoval.checked;
            queensSettings.openingHint = queenOpeningHintSlider.value === '1';
            localStorage.setItem('queens_settings', JSON.stringify(queensSettings));
            queensOptionsModal.classList.remove('open');
            refreshAutomaticExclusions();
            renderQueensBoard();
        });
        queensNewGameBtn.addEventListener('click', () => initQueensGame(parseInt(queensSizeSelect.value), queensDifficultySelect.value));
        queensHintBtn.addEventListener('click', giveQueensHint);
        queensSizeSelect.addEventListener('change', event => initQueensGame(parseInt(event.target.value), queensDifficultySelect.value));
        queensDifficultySelect.addEventListener('change', event => initQueensGame(parseInt(queensSizeSelect.value), event.target.value));
        initQueensGame();
    </script>
</body>
</html>
