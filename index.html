<div class="container">
    <!-- Top Game Navigation Tabs -->
    <nav class="game-nav">
        <button class="nav-tab active" data-game="sudoku">Sudoku</button>
        <button class="nav-tab" data-game="tango">Tango</button>
        <button class="nav-tab" data-game="queens">Queens</button>
    </nav>

    <!-- SUDOKU VIEW (Your Existing Game) -->
    <div class="game-view active" id="sudokuView">
        <header>
            <h1>Sudoku</h1>
            <div class="controls-top">
                <select id="difficultySelect" class="btn-secondary">
                    <option value="easy">Easy</option>
                    <option value="medium" selected>Medium</option>
                    <option value="hard">Hard</option>
                    <option value="expert">Expert</option>
                </select>
                <button class="btn-secondary" id="optionsBtn" title="Options">⚙️</button>
                <button class="btn-secondary" id="newGameBtn">New Game</button>
                <button class="btn-secondary" id="themeToggleBtn">🌙</button>
            </div>
        </header>

        <div class="toolbar">
            <button class="mode-toggle" id="modeToggleBtn">Mode: Fill</button>
            <div class="action-group">
                <button class="btn-secondary" id="undoBtn">↩️ Undo</button>
                <button class="btn-secondary" id="redoBtn">↪️ Redo</button>
            </div>
        </div>

        <div class="game-info">
            <span id="difficultyDisplay">Difficulty: Medium</span>
            <span id="timerDisplay">Time: 00:00</span>
        </div>

        <div class="sudoku-board" id="sudokuBoard"></div>
        <div class="number-pad" id="numberPad"></div>

        <div class="history-section">
            <h3>Completed Games History</h3>
            <ul class="history-list" id="historyList">
                <li style="color: var(--border-color); font-style: italic;">No completed games yet.</li>
            </ul>
        </div>
    </div>

    <!-- TANGO VIEW (Placeholder for next step) -->
    <div class="game-view" id="tangoView">
        <header>
            <h1>Tango (☀️ / 🌙)</h1>
            <div class="controls-top">
                <select id="tangoDifficultySelect" class="btn-secondary">
                    <option value="easy">Easy</option>
                    <option value="medium" selected>Medium</option>
                    <option value="hard">Hard</option>
                </select>
                <button class="btn-secondary" id="tangoNewGameBtn">New Game</button>
            </div>
        </header>
        <div class="game-info">
            <span>Difficulty: Medium</span>
            <span id="tangoTimerDisplay">Time: 00:00</span>
        </div>
        <div class="tango-board" id="tangoBoard" style="margin: 40px 0; text-align: center; color: var(--border-color);">
            [ Tango Board Coming Up Next ]
        </div>
    </div>

    <!-- QUEENS VIEW (Placeholder for next step) -->
    <div class="game-view" id="queensView">
        <header>
            <h1>Queens 👑</h1>
            <div class="controls-top">
                <select id="queensDifficultySelect" class="btn-secondary">
                    <option value="easy">Easy (6x6)</option>
                    <option value="medium" selected>Medium (8x8)</option>
                    <option value="hard">Hard (9x9)</option>
                </select>
                <button class="btn-secondary" id="queensNewGameBtn">New Game</button>
            </div>
        </header>
        <div class="game-info">
            <span>Difficulty: Medium</span>
            <span id="queensTimerDisplay">Time: 00:00</span>
        </div>
        <div class="queens-board" id="queensBoard" style="margin: 40px 0; text-align: center; color: var(--border-color);">
            [ Queens Board Coming Up Next ]
        </div>
    </div>
</div>
